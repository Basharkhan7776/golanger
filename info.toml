# --- 13_channels ---

[[exercises]]
name = "channels1"
path = "exercises/13_channels/channels1.go"
mode = "compile"
hint = """
Channels are typed conduits for sending and receiving values:
  ch := make(chan int)
  go func() { ch <- 42 }()  // send
  value := <-ch              // receive (blocks until a value is sent)
Unbuffered channels require both sender and receiver to be ready.
"""

[[exercises]]
name = "channels2"
path = "exercises/13_channels/channels2.go"
mode = "compile"
hint = """
Buffered channels have a capacity — sends don't block until the buffer is full:
  ch := make(chan int, 3)  // buffer size 3
  ch <- 1  // doesn't block
  ch <- 2  // doesn't block
  ch <- 3  // doesn't block
  ch <- 4  // BLOCKS — buffer is full
"""

[[exercises]]
name = "channels3"
path = "exercises/13_channels/channels3.go"
mode = "compile"
hint = """
Channel directions restrict a channel to send-only or receive-only:
  func producer(ch chan<- int) { ch <- 42 }   // can only send
  func consumer(ch <-chan int) { v := <-ch }   // can only receive
This prevents accidental misuse and documents intent.
"""

[[exercises]]
name = "channels4"
path = "exercises/13_channels/channels4.go"
mode = "test"
hint = """
`range` on a channel receives values until the channel is closed:
  for v := range ch {
      fmt.Println(v)
  }
The sender must `close(ch)` when done, or range will block forever.
"""

[[exercises]]
name = "channels5"
path = "exercises/13_channels/channels5.go"
mode = "test"
hint = """
The pipeline pattern chains stages where each is a goroutine:
  Stage 1: generate values → channel
  Stage 2: read from channel, transform → another channel
  Stage 3: read from channel, collect results
Each stage runs concurrently!
"""

# --- 14_select ---

[[exercises]]
name = "select1"
path = "exercises/14_select/select1.go"
mode = "compile"
hint = """
`select` lets you wait on multiple channel operations:
  select {
  case v := <-ch1:
      fmt.Println("from ch1:", v)
  case v := <-ch2:
      fmt.Println("from ch2:", v)
  }
It blocks until one case is ready. If multiple are ready, one is chosen randomly.
"""

[[exercises]]
name = "select2"
path = "exercises/14_select/select2.go"
mode = "compile"
hint = """
Use `time.After(duration)` in select for timeouts:
  select {
  case result := <-ch:
      fmt.Println(result)
  case <-time.After(2 * time.Second):
      fmt.Println("timeout!")
  }
"""

[[exercises]]
name = "select3"
path = "exercises/14_select/select3.go"
mode = "test"
hint = """
A `default` case in select makes it non-blocking:
  select {
  case v := <-ch:
      return v, true
  default:
      return 0, false  // channel is empty, don't block
  }
"""

[[exercises]]
name = "select4"
path = "exercises/14_select/select4.go"
mode = "test"
hint = """
The "done channel" pattern signals goroutines to stop:
  done := make(chan struct{})
  go func() {
      for {
          select {
          case <-done:
              return
          default:
              // do work
          }
      }
  }()
  close(done)  // signals all goroutines listening on done
"""

# --- 15_sync ---

[[exercises]]
name = "sync1"
path = "exercises/15_sync/sync1.go"
mode = "compile"
hint = """
`sync.Mutex` provides mutual exclusion:
  var mu sync.Mutex
  var count int
  mu.Lock()
  count++
  mu.Unlock()
Always pair Lock with Unlock. Use `defer mu.Unlock()` for safety.
"""

[[exercises]]
name = "sync2"
path = "exercises/15_sync/sync2.go"
mode = "compile"
hint = """
`sync.RWMutex` allows multiple concurrent readers but only one writer:
  var rwmu sync.RWMutex
  rwmu.RLock()    // multiple goroutines can RLock simultaneously
  rwmu.RUnlock()
  rwmu.Lock()     // exclusive — blocks until all RLocks are released
  rwmu.Unlock()
"""

[[exercises]]
name = "sync3"
path = "exercises/15_sync/sync3.go"
mode = "test"
hint = """
`sync.Once` ensures a function runs exactly once, even if called concurrently:
  var once sync.Once
  once.Do(func() {
      // initialization code — runs only once
  })
"""

[[exercises]]
name = "sync4"
path = "exercises/15_sync/sync4.go"
mode = "test"
hint = """
`sync.Map` is a concurrent-safe map:
  var m sync.Map
  m.Store("key", "value")
  v, ok := m.Load("key")
  m.Delete("key")
  m.Range(func(k, v interface{}) bool {
      fmt.Println(k, v)
      return true  // continue iteration
  })
"""

[[exercises]]
name = "sync5"
path = "exercises/15_sync/sync5.go"
mode = "test"
hint = """
Worker pool pattern:
  1. Create a jobs channel and a results channel
  2. Start N worker goroutines that read from jobs and write to results
  3. Send jobs on the jobs channel, then close it
  4. Collect results from the results channel
"""

[[exercises]]
name = "sync6"
path = "exercises/15_sync/sync6.go"
mode = "test"
hint = """
Fan-out: start multiple goroutines reading from the same channel.
Fan-in: merge multiple channels into one using a goroutine per source:
  func merge(channels ...<-chan int) <-chan int {
      out := make(chan int)
      var wg sync.WaitGroup
      for _, ch := range channels {
          wg.Add(1)
          go func(c <-chan int) {
              defer wg.Done()
              for v := range c { out <- v }
          }(ch)
      }
      go func() { wg.Wait(); close(out) }()
      return out
  }
"""

