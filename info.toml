# --- 12_goroutines ---

[[exercises]]
name = "goroutines1"
path = "exercises/12_goroutines/goroutines1.go"
mode = "compile"
hint = """
Start a goroutine with the `go` keyword:
  go myFunction()
  go func() { fmt.Println("hello from goroutine") }()
