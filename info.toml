name = "functions3"
path = "exercises/03_functions/functions3.go"
mode = "compile"
hint = """
Named return values act as variables defined at the top of the function:
  func split(sum int) (x, y int) {
      x = sum * 4 / 9
      y = sum - x
      return  // "naked" return — returns x and y
  }
"""

[[exercises]]
name = "functions4"
path = "exercises/03_functions/functions4.go"
mode = "compile"
hint = """
Variadic functions accept a variable number of arguments:
  func sum(nums ...int) int {
      total := 0
      for _, n := range nums {
          total += n
      }
      return total
  }
Call it with: sum(1, 2, 3) or sum(mySlice...)
"""

[[exercises]]
name = "functions5"
path = "exercises/03_functions/functions5.go"
mode = "compile"
hint = """
Functions are first-class values in Go. You can assign them to variables:
  add := func(a, b int) int { return a + b }
  result := add(3, 4)

Closures capture variables from their enclosing scope:
  func counter() func() int {
      count := 0
      return func() int {
          count++
          return count
      }
  }
"""

