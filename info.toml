hint = """
When multiple goroutines write to shared state, protect it with sync.Mutex:
  var mu sync.Mutex
  mu.Lock()
  // critical section
  mu.Unlock()
Or use defer: `mu.Lock(); defer mu.Unlock()`
"""

[[exercises]]
name = "goroutines4"
path = "exercises/12_goroutines/goroutines4.go"
mode = "test"
hint = """
Be careful with loop variables in goroutines! The variable is shared:
  for i := 0; i < 5; i++ {
