# --- 06_arrays_slices ---

[[exercises]]
name = "arrays1"
path = "exercises/06_arrays_slices/arrays1.go"
mode = "compile"
hint = """
Arrays in Go have a fixed size and the size is part of the type:
  var a [5]int              // array of 5 ints (all zero)
  b := [3]string{"a", "b", "c"}  // array literal
  fmt.Println(a[0])        // access element
  fmt.Println(len(b))      // length
"""

[[exercises]]
name = "slices1"
path = "exercises/06_arrays_slices/slices1.go"
mode = "compile"
hint = """
Slices are dynamic, flexible views into arrays:
  s := []int{1, 2, 3}       // slice literal
  s = append(s, 4, 5)       // append returns a new slice
  fmt.Println(len(s))       // 5
Remember: `append` may allocate a new underlying array!
"""

[[exercises]]
name = "slices2"
path = "exercises/06_arrays_slices/slices2.go"
mode = "compile"
hint = """
You can create sub-slices with the slice operator [low:high]:
  s := []int{0, 1, 2, 3, 4}
  sub := s[1:3]  // [1, 2] — low inclusive, high exclusive
  s[:3]          // [0, 1, 2] — from start
  s[2:]          // [2, 3, 4] — to end
Use `copy(dst, src)` to copy slices.
"""

[[exercises]]
name = "slices3"
path = "exercises/06_arrays_slices/slices3.go"
mode = "test"
hint = """
`make([]T, length, capacity)` creates a slice with specified length and capacity:
  s := make([]int, 0, 10)  // len=0, cap=10
  s = append(s, 1)          // len=1, cap=10
  fmt.Println(len(s), cap(s))
`len()` returns current length, `cap()` returns underlying array capacity.
"""

