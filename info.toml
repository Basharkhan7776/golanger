  r.Use(gin.Logger())     // add logger middleware
  r.Use(gin.Recovery())   // add recovery middleware
Or simply use `gin.Default()` which includes both.
"""

[[exercises]]
name = "middleware2"
path = "exercises/17_gin_middleware/middleware2.go"
mode = "test"
hint = """
`gin.Recovery()` recovers from panics and returns a 500 error:
  r := gin.New()
  r.Use(gin.Recovery())
  r.GET("/panic", func(c *gin.Context) {
      panic("something went wrong")
  })
Without Recovery, the server would crash on panic.
"""

[[exercises]]
name = "middleware3"
path = "exercises/17_gin_middleware/middleware3.go"
mode = "test"
hint = """
Custom middleware is a function that returns `gin.HandlerFunc`:
  func RequestID() gin.HandlerFunc {
      return func(c *gin.Context) {
          c.Header("X-Request-ID", "some-unique-id")
          c.Next()  // call the next handler
      }
  }
Use `c.Next()` to pass to the next middleware/handler.
"""

[[exercises]]
name = "middleware4"
path = "exercises/17_gin_middleware/middleware4.go"
mode = "test"
hint = """
Auth middleware checks the Authorization header:
  func AuthMiddleware(token string) gin.HandlerFunc {
      return func(c *gin.Context) {
          auth := c.GetHeader("Authorization")
          if auth != "Bearer " + token {
              c.AbortWithStatusJSON(401, gin.H{"error": "unauthorized"})
              return
          }
          c.Next()
      }
  }
Use `c.Abort()` or `c.AbortWithStatusJSON()` to stop the chain.
"""

[[exercises]]
name = "middleware5"
path = "exercises/17_gin_middleware/middleware5.go"
mode = "test"
hint = """
CORS middleware sets the appropriate headers:
  func CORSMiddleware() gin.HandlerFunc {
      return func(c *gin.Context) {
          c.Header("Access-Control-Allow-Origin", "*")
          c.Header("Access-Control-Allow-Methods", "GET, POST, PUT, DELETE, OPTIONS")
          c.Header("Access-Control-Allow-Headers", "Content-Type, Authorization")
          if c.Request.Method == "OPTIONS" {
              c.AbortWithStatus(204)
              return
          }
          c.Next()
      }
  }
"""

